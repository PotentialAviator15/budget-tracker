{% extends 'base.html' %} {% block title %}All Transactions{% endblock %} {%
block content %}
<table class="table table-striped">
  <thead>
    <tr>
      <th>Date</th>
      <th>Description</th>
      <th>Amount ($)</th>
      <th>Category</th>
      <th>Type</th>
    </tr>
  </thead>
  <tbody>
    {% for tx in transactions %}
    <tr>
      <td>{{ tx['date'] }}</td>
      <td>{{ tx['description'] }}</td>
      <td>{{ tx['amount'] }}</td>
      <td>{{ tx['category'] }}</td>
      <td>{{ tx['type'] }}</td>
    </tr>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
